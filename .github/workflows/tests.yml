# Runs every test on GitHub's machines, so anyone with repo access can check the code without
# installing anything: open the Actions tab, pick the latest "tests" run, and read each job's log
# and the summary at the top.
name: tests

# Docs-only changes skip CI. A manual run (Run workflow) always runs everything.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App maths (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (curve, pool, fees, hold age, scoring, boards, property tests)
        run: bun run test

  engine:
    name: Trading engine (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # The `ci` profile is release without fat LTO: same optimised code, much faster to compile.
      - name: Engine tests (exact rounding, pool, order book, routing, fuzzing)
        run: cargo test --profile ci
      # A correctness test, not a speed test: ~600,000 actions, and after every one the whole state
      # is re-checked. Its time is mostly those checks. Engine speed is the latency job.
      - name: 6,000 random trading runs (~600,000 actions), every rule re-checked after each action
        env:
          PROPTEST_CASES: "3000"
        run: |
          start=$(date +%s)
          cargo test --profile ci --test properties
          secs=$(( $(date +%s) - start ))
          {
            echo "### Random trading (correctness)"
            echo "- 6,000 random runs: 3,000 of mixed trading (buys, sells, limit orders, cancels, liquidity, withdrawals, dividend rounds) and 3,000 from launch through graduation into the pool"
            echo "- About 600,000 actions in total, over 400,000 of them trades"
            echo "- After every single action, every rule is re-checked against the whole state: custody equals what's owed to the cent, tokens are conserved, pools cover every LP, the order book is consistent"
            echo "- Passed in ${secs} s. That time is mostly the re-checks, not trading: engine speed per order is in the latency section"
          } >> "$GITHUB_STEP_SUMMARY"

  latency:
    name: Engine latency (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Latency benchmark (time per order)
        run: |
          cargo run --release -q --example latency | tee latency.txt
          {
            echo "### Trading engine speed (per order, production build)"
            echo "20,000 orders, each routed through the pool and order book. p50 = a typical order, p99 = the slowest 1%. µs = millionths of a second. GitHub's shared machines are about 2x slower than a laptop."
            echo '```'
            cat latency.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  program:
    name: Solana contract (Anchor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERSION: 3.1.7
      ANCHOR_VERSION: 1.2.2
      RUST_VERSION: 1.98.0 # pinned in anchor/rust-toolchain.toml
      # No debug info in the test build: a much smaller build cache and faster linking.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anchor

      # The compiled program is cached by a hash of everything it's built from. When none of that
      # changed, it's reused, and the 1.2 GB Solana toolchain is never downloaded. Any change to
      # the program's code, its dependencies or the tool versions rebuilds it from scratch.
      - name: Reuse the compiled program if its code hasn't changed
        id: so-cache
        uses: actions/cache@v6
        with:
          path: anchor/target/deploy/score.so
          key: score-so-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles('anchor/programs/score/src/**', 'anchor/programs/score/Cargo.toml', 'anchor/Cargo.toml', 'anchor/Cargo.lock', 'anchor/Anchor.toml', 'anchor/rust-toolchain.toml') }}

      - name: Cache Solana CLI and build tools
        if: steps.so-cache.outputs.cache-hit != 'true'
        id: solana-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Solana CLI
        if: steps.so-cache.outputs.cache-hit != 'true' && steps.solana-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
      - if: steps.so-cache.outputs.cache-hit != 'true'
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor CLI
        if: steps.so-cache.outputs.cache-hit != 'true'
        id: anchor-cache
        uses: actions/cache@v6
        with:
          path: ~/.anchor-cli
          key: anchor-cli-${{ env.ANCHOR_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Anchor CLI (first run only, ~10 min)
        if: steps.so-cache.outputs.cache-hit != 'true' && steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked --root ~/.anchor-cli
      - if: steps.so-cache.outputs.cache-hit != 'true'
        run: echo "$HOME/.anchor-cli/bin" >> "$GITHUB_PATH"

      - name: Build the program
        if: steps.so-cache.outputs.cache-hit != 'true'
        working-directory: anchor
        run: |
          solana --version
          anchor --version
          anchor build --ignore-keys --arch v2 --no-idl # the tests only need the .so

      - name: Contract tests (deposits, withdrawals, batches, forced requests, exit mode)
        working-directory: anchor
        run: |
          cargo test -- --nocapture 2>&1 | tee test.txt
          {
            echo "### Solana contract compute units"
            echo '```'
            grep '^CU:' test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
