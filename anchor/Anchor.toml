[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
score = "3tP3HKuoPDYKvUuGUYeRXbNQZHQeHU5BabRCwZwcXELo"

[programs.devnet]
score = "3tP3HKuoPDYKvUuGUYeRXbNQZHQeHU5BabRCwZwcXELo"

# Default to localnet so building and testing never touch devnet. Deploy to devnet explicitly:
#   anchor deploy --provider.cluster devnet
[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]
