[package]
name = "score"
version = "0.1.0"
description = "score custody program: USDC custody, instant deposits and voucher withdrawals, batch commits, forced exits"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "score"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = { version = "1.2.2", default-features = false, features = ["solana-v3", "token", "token_2022"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-instructions-sysvar = "3.0"
solana-sdk-ids = "3.1"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
litesvm = { version = "0.18.2", features = ["precompiles"] }
solana-sdk = "4.0.1"
ed25519-dalek = "2"
score-engine = { path = "../../../engine/score-engine" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
