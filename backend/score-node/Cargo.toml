[package]
name = "score-node"
version = "0.1.0"
edition = "2021"
description = "score backend: engine + log, API and live updates, permit signer, relayer, chain watcher, batch committer, Postgres writer"

[dependencies]
score-engine = { path = "../../engine/score-engine" }
score = { path = "../../anchor/programs/score", features = ["no-entrypoint"] }
anchor-lang = "1.2.2"
solana-sdk = "4.0.1"
bincode = "1.3"
bytemuck = "1"
borsh = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
bs58 = "0.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-cert = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
libc = "0.2"
