function lpAdd(id){if(need())return;if(locked())return toast("Liquidity changes are paused during a matchday");const p=G(id),a=+$("lpa").value;if(!(a>0)||a>S.usdc)return toast("Check amount and balance");const half=a/2,net=half*(1-.0025-.0005),px=pr(p);
S.usdc-=a;S.treasury+=half*.0005;p.xlp=(p.xlp||0)+half*.0025;const L=S.lp[id]||{u:0,t:0,px,ts:now(),fees:0},cur=lpVal(id);if(S.lp[id]){L.u=cur/2;L.t=cur/2/px}L.u+=half;L.t+=net/px;L.px=px;L.ts=S.lp[id]?(L.ts+now())/2:now();S.lp[id]=L;sv();toast("Liquidity added");render()}
function lpOut(id){if(locked())return toast("Liquidity changes are paused during a matchday");const L=S.lp[id];if(!L)return;const p=G(id),r=pr(p)/L.px,sq=Math.sqrt(r),u=L.u*sq,t=L.t/sq,h=S.hold[id]||0;S.usdc+=u+L.fees;S.t[id]=((S.t[id]||now())*h+L.ts*t)/(h+t);S.hold[id]=h+t;delete S.lp[id];sv();toast("Withdrew "+f$(u+L.fees,2)+" and "+Math.round(t).toLocaleString()+" tokens");render()}
function lpClaim(id){const L=S.lp[id];if(!L||L.fees<=0)return;S.usdc+=L.fees;toast("Claimed "+f$(L.fees,2)+" fees");L.fees=0;sv();render()}
let IL=50;
function lpTab(p){const L=S.lp[p.id],v=lpVal(p.id),share=v/(ptv(p)+v)*100,apr=p.v24*LPF*365/ptv(p)*100,r=1+IL/100,il=(1-2*Math.sqrt(r)/(1+r))*100;
return`<div class="grid g4">${stat("Pool depth",f$(ptv(p),0))}${stat("Fee APR (demo volume)",apr.toFixed(0)+"%")}${stat("Your position",L?f$(v,2):"None")}${stat("Fees earned",L?f$(L.fees,2):"$0.00","up")}</div>
<div class="two" style="margin-top:12px"><div class="card"><b>Add liquidity</b><p class="sm mu">Add USDC and ${p.tk} together at the pool ratio, or deposit USDC only and we swap half into ${p.tk} first. You earn 0.25% of every swap (proposed), added to the pool. Your tokens keep their holding age when you withdraw.</p><input id="lpa" type="number" min="1" placeholder="USDC amount" oninput="lpNeed('${p.id}')"><div class="sm mu" id="lpn" style="margin:6px 0">Enter a USDC amount to see the tokens needed.</div><div class="row"><button onclick="lpBoth('${p.id}')">Add USDC + tokens</button><button class="sec" onclick="lpAdd('${p.id}')">USDC only (zap)</button></div>${L?`<div class="row" style="margin-top:10px"><button class="sec" onclick="lpClaim('${p.id}')">Claim fees</button><button class="sec" onclick="lpOut('${p.id}')">Remove all</button></div>`:""}<p class="sm mu">Fees and APR use demo trading volume, which is far above modelled turnover. At 5% weekly turnover a 0.25% fee yields only about 1.3% a year, so LPs would also need dividend pass-through or points. You earn dividends on your share of the pool’s tokens as recorded at kickoff. Adding or removing liquidity stays open during matchdays.</p></div>
<div class="card"><b>Impermanent loss</b><p class="sm mu">If ${p.tk}’s price moves, an LP holds less of the token that rose and more of the one that fell.</p><div class="row"><input type="range" min="-60" max="300" value="${IL}" oninput="IL=+this.value;render()" style="padding:0"><b style="width:90px">${IL>0?"+":""}${IL}%</b></div><div class="big">${il.toFixed(1)}% <span class="sm mu">loss vs holding</span></div><p class="sm mu">The locked protocol seed ($17,500 per side) stays in the pool permanently, so depth never falls below it.</p></div></div>`}

let DT="st",TD=30;
const SCHED=()=>{const sch=P.slice(10);let dd=new Date(Date.UTC(2026,9,28)),o=[];for(let i=0;i<sch.length;i+=2){while([0,6].includes(dd.getUTCDay()))dd.setUTCDate(dd.getUTCDate()+1);o.push([dd.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}),sch[i],sch[i+1]]);dd.setUTCDate(dd.getUTCDate()+1)}return o};

const tv=()=>releasePool();
function mrow(p){const t=p.grad;return`<tr class="pl" onclick="location.hash='#/${t?"trade":"ico"}?p=${p.id}'"><td><a href="#/player/${p.id}" onclick="event.stopPropagation()"><b>${p.name}</b></a> <span class="chip">${p.tk}</span></td><td>${p.pos}</td><td>${LG[p.lg]}</td><td>${f$(t?pr(p):cp(p),5)}</td><td class="${pc(p)>=0?"up":"dn"}">${pc(p).toFixed(2)}%</td><td>${f$(p.v24,0)}</td><td>${p.avg.toFixed(1)}</td><td>${t?'<span class="chip">TRADING</span>':'<span class="chip" style="background:rgba(76,141,255,.15);color:#4c8dff">ICO '+Math.min(100,p.raised/THRESH*100).toFixed(0)+'%</span>'}</td></tr>`}
function tradeA(mode){const ico=mode==="ico",list=ico?P.filter(p=>!p.grad&&p.i<10):P.filter(p=>p.grad);if(!list.length)return`<p class="mu">Nothing here. <a class="up" href="#/${ico?"trade":"ico"}">Switch →</a></p>`;
const q=location.hash.split("?p=")[1],sel=list.find(p=>p.id===q)||list[0];TR.sel=sel.id;const x=ico?cp(sel):pr(sel),ch=pc(sel),bp=Math.min(100,sel.raised/THRESH*100),tabsB=tabs(sel);
const side=`<div class="card" style="padding:0;max-height:560px;overflow:auto"><table>${list.map(p=>`<tr class="pl" onclick="location.hash='#/${mode}?p=${p.id}'" style="${p.id===sel.id?"background:var(--gl)":""}"><td><b>${p.tk}</b></td><td>${f$(ico?cp(p):pr(p),4)}</td><td class="${pc(p)>=0?"up":"dn"}">${pc(p).toFixed(1)}%</td></tr>`).join("")}</table></div>`;
const head=`<div class="strip">${[[ico?"Player":"Asset",`<a href="#/player/${sel.id}">${sel.name}</a> ${sel.tk}`],["Price",f$(x,5)],["24h",(ch>=0?"+":"")+ch.toFixed(2)+"%"],["24h vol",f$(sel.v24,0)],[ico?"Bonded":"Score",ico?bp.toFixed(0)+"%":sel.avg.toFixed(1)]].map(v=>`<div><span class="mu">${v[0]}</span><b>${v[1]}</b></div>`).join("")}</div>`;
if(ico){const det=`<div class="card"><b>Player</b><div style="margin-top:10px">${[["Name",sel.name],["Club",sel.club],["Country",sel.country],["Age",sel.age],["Position",sel.pos],["League",LG[sel.lg]],["Average score",sel.avg.toFixed(1)]].map(r=>`<div class="row sp sm" style="padding:7px 0;border-bottom:1px solid var(--bd)"><span class="mu">${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div><div style="margin-top:12px"><b class="sm">Competitions</b><div style="margin-top:6px">${comps(sel).map(c=>`<span class="chip" style="margin:2px">${c}</span>`).join("")}</div></div></div>`;
return`${head}<div class="two" style="margin-top:12px"><div>${ticketHTML(sel,1)}<div class="card" style="margin-top:12px"><div class="row sp"><b>Bonding curve</b><span class="mu sm">${f$(sel.raised,0)} of $25,000 · ${Math.round(sel.sold).toLocaleString()} tokens sold</span></div>${bchart(sel)}</div></div>${det}</div>${tabsB}<h2>Live launches</h2><div class="card wrap" style="padding:0"><table>${list.map(mrow).join("")}</table></div><h2>Launch schedule</h2><p class="mu sm">10 launches a week until 200 players (week 20), then one a week chosen by vote.</p><div class="card wrap"><table><tr><th>Date</th><th>14:00 UTC</th><th>20:00 UTC</th></tr>${SCHED().map(r=>`<tr><td>${r[0]}</td>${[r[1],r[2]].map(y=>`<td><a href="#/player/${y.id}"><b>${y.name}</b></a> <span class="chip">${y.tk}</span></td>`).join("")}</tr>`).join("")}</table></div>`}
return`${lockBar()}${head}<div class="term" style="margin-top:12px"><div>${side}<div class="card" style="padding:8px;margin-top:10px"><b class="sm">Order book</b>${book(sel)}</div></div><div class="card">${tchart(sel)}</div>${ticketHTML(sel,0)}</div>${tabsB}`}
function playerA(id){const p=G(id);if(!p)return"Not found";const x=p.grad?pr(p):cp(p),ch=pc(p),T_=[["over","Overview"],["sc","Matchdays"],["hold","Holders"]].concat(p.grad?[["liq","Liquidity"]]:[]);let b="";
if(PT==="over")b=`<div class="grid g4">${[["Age",p.age],["Club",p.club],["Country",p.country],["League",LG[p.lg]],["Position",p.pos],["Average score",p.avg.toFixed(1)],["Dividends paid",f$(p.div,0)],["Reserve left",Math.round(p.rsv).toLocaleString()]].map(y=>stat(y[0],y[1])).join("")}</div><div class="card" style="margin-top:12px"><b>Competitions</b> ${comps(p).map(c=>`<span class="chip">${c}</span>`).join(" ")}</div>`;
if(PT==="sc")b=`<div class="wrap"><table><tr><th>MD</th>${p.md.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr><tr><td>Score</td>${p.md.map(v=>`<td>${v.toFixed(1)}</td>`).join("")}</tr><tr><td>Board</td>${p.rk.map(k=>`<td class="${k<=5?"up":"mu"}">${k<=5?"#"+k+" ✓":"#"+k}</td>`).join("")}</tr></table></div>`;
if(PT==="hold")b=`<table><tr><th>#</th><th>Holder</th><th>Share</th></tr>${["0x7a…c2","goalhanger","nutmeg.sol","rondo_fan","You"].map((n,i)=>`<tr><td>${i+1}</td><td>${n}</td><td>${n==="You"?((S.hold[p.id]||0)/Math.max(1,p.sold)*100).toFixed(2):[6.1,4.4,3.2,2][i]}%</td></tr>`).join("")}</table>`;
if(PT==="liq")b=p.grad?lpTab(p):"";return`<div class="strip">${[["Asset",p.name+" · "+p.tk],["Price",f$(x,5)],["24h",(ch>=0?"+":"")+ch.toFixed(2)+"%"],["24h vol",f$(p.v24,0)],["Score",p.avg.toFixed(1)]].map(v=>`<div><span class="mu">${v[0]}</span><b>${v[1]}</b></div>`).join("")}</div><div class="two" style="margin-top:12px"><div class="card">${tchart(p)}</div><div class="card"><b>${p.grad?"Trading":"ICO "+Math.min(100,p.raised/THRESH*100).toFixed(0)+"% bonded"}</b><p class="mu sm">${p.grad?"Sell tax 5% → 0.5% over 90 days. Buy fee 5 bps.":"Flat 1.25% fee until bonded."}</p><a class="btn" style="display:block;text-align:center" href="#/${p.grad?"trade":"ico"}?p=${p.id}">${p.grad?"Open terminal":"Join launch"}</a><div class="sm mu" style="margin-top:10px">You hold <b>${(S.hold[p.id]||0).toFixed(0)}</b> ${p.tk}</div></div></div><div class="card" style="margin-top:12px"><div class="tabs">${T_.map(t=>`<button class="${PT===t[0]?"on":""}" onclick="PT='${t[0]}';render()">${t[1]}</button>`).join("")}</div>${b}</div>`}
